# ═══════════════════════════════════════════════════════════════════════
#  picom — nightgrid
#  Tuned for a VMware guest: cheap effects only, no blur, no animations.
#  If picom refuses to start, 3D acceleration is probably off in the VM.
#  Switch backend to "xrender" below and it will work anywhere.
# ═══════════════════════════════════════════════════════════════════════

backend = "xrender";
vsync = true;
use-damage = false;

# ─── Corners ───────────────────────────────────────────────────────────
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3-frame'",
    "class_g = 'i3bar'"
];

# ─── Shadows ───────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ─── Fading ────────────────────────────────────────────────────────────
# ~110 ms in and out. Fast enough that it never sits between you and a shell.
fading = true;
fade-in-step = 0.14;
fade-out-step = 0.14;
fade-delta = 4;
fade-exclude = [];

# ─── Opacity ───────────────────────────────────────────────────────────
# Inactive windows are dimmed a hair to give the focused one weight.
# Anything you read output from stays fully opaque.
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
detect-client-opacity = true;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'firefox-esr'",
    "100:class_g = 'Navigator'",
    "100:class_g = 'burp-StartBurp'",
    "100:class_g = 'Wireshark'",
    "100:class_g = 'i3lock'",
    "100:fullscreen"
];

# ─── Misc ──────────────────────────────────────────────────────────────
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = true;

wintypes:
{
    tooltip      = { fade = true; shadow = false; focus = true; };
    dock         = { shadow = false; };
    dnd          = { shadow = false; };
    popup_menu   = { opacity = 1.0; };
    dropdown_menu= { opacity = 1.0; };
};
