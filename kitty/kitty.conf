# ═══════════════════════════════════════════════════════════════════════
#  kitty — Kali OSCP Workstation
#  Default keybindings are untouched: Ctrl+Shift+C / V / F behave as usual.
# ═══════════════════════════════════════════════════════════════════════

include nightgrid.conf

# ─── Font ──────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Slightly looser lines read better in long scan output.
adjust_line_height  108%
disable_ligatures   never

# ─── Cursor ────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
cursor_trail          1
cursor_trail_decay    0.05 0.15

# ─── Scrollback ────────────────────────────────────────────────────────
scrollback_lines            50000
scrollback_pager_history_size 64

# ─── Performance ───────────────────────────────────────────────────────
repaint_delay   8
input_delay     1
sync_to_monitor yes

# ─── Window ────────────────────────────────────────────────────────────
window_padding_width    10
window_margin_width     0
remember_window_size    no
initial_window_width    120c
initial_window_height   35c
hide_window_decorations yes
placement_strategy      center

# A hair of transparency so the wallpaper grid shows through.
# Set to 1.0 for exam conditions — Super+Shift+P does that for you.
background_opacity         0.85
dynamic_background_opacity yes

# Needed so toggle-effects can flip opacity without restarting kitty.
allow_remote_control socket-only
listen_on            unix:@kitty

# ─── Bell ──────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0

# ─── Close ─────────────────────────────────────────────────────────────
confirm_os_window_close 0

# ─── Mouse ─────────────────────────────────────────────────────────────
copy_on_select      yes
mouse_hide_wait     2.0
url_style           curly
underline_hyperlinks hover

# ─── Clipboard ─────────────────────────────────────────────────────────
strip_trailing_spaces smart
clipboard_control     write-clipboard write-primary read-clipboard read-primary

# ─── Tabs (unused under i3+tmux, styled anyway) ────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round

# ─── Multi-clipboard (kitty named buffers) ─────────────────────────────
# Ctrl+Shift+C/V — system clipboard (default). This is what extractports,
# xclip, and every other app (Firefox, Burp) read/write to.
map ctrl+shift+c copy_to_buffer clipboard
map ctrl+shift+v paste_from_buffer clipboard

# Ctrl+Alt+Shift+C/V — private buffer #2, kitty-only, doesn't touch the
# system clipboard or other apps.
map ctrl+alt+shift+c copy_to_buffer b
map ctrl+alt+shift+v paste_from_buffer b

# Ctrl+Alt+Shift+X/P — private buffer #3, kitty-only.
map ctrl+alt+shift+x copy_to_buffer c
map ctrl+alt+shift+p paste_from_buffer c
