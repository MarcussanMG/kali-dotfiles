# ═══════════════════════════════════════════════════════════════════════
#  tmux — Kali OSCP Workstation
#  Theme: nightgrid.  Every existing binding is preserved verbatim.
# ═══════════════════════════════════════════════════════════════════════

# ─── Prefix: Ctrl+A ────────────────────────────────────────────────────
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ─── Reload: Ctrl+A then r ─────────────────────────────────────────────
bind-key r source-file ~/.tmux.conf \; display-message " tmux configuration reloaded"

# ─── Splits: Ctrl+A then / or - ────────────────────────────────────────
unbind-key %
unbind-key '"'
bind-key / split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# ─── Pane navigation ───────────────────────────────────────────────────
bind-key Left  select-pane -L
bind-key Right select-pane -R
bind-key Up    select-pane -U
bind-key Down  select-pane -D

# ─── Pane title: Ctrl+A then t ─────────────────────────────────────────
bind-key t command-prompt -p "Pane title:" "select-pane -T '%%'"

# ═══════════════════════════════════════════════════════════════════════
#  Additions — new bindings, nothing above was changed
# ═══════════════════════════════════════════════════════════════════════
# Ctrl+A then S — show or hide the status line (off by default)
bind-key S set-option -g status
bind-key N command-prompt -p "New session name:" "new-session -s '%%'"

# ─── General ───────────────────────────────────────────────────────────
set-option -g mouse on
set-option -g history-limit 100000
set-option -sg escape-time 0
set-option -g status on
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g focus-events on
set-option -g set-titles off
set-option -g set-titles-string "#S  #W"

set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# ─── Copy mode ─────────────────────────────────────────────────────────
set -g mode-keys emacs
bind-key -T copy-mode Space send-keys -X begin-selection
bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel

# ═══════════════════════════════════════════════════════════════════════
#  nightgrid
# ═══════════════════════════════════════════════════════════════════════

# ─── Pane borders ──────────────────────────────────────────────────────
set-option -g pane-border-status top
set-option -g pane-border-lines  heavy
set-option -g pane-border-format " #{?pane_active,#[fg=#05070a]#[bg=#22c55e]#[bold],#[fg=#4b5e54]#[bg=#0d1410]} #{pane_index} #{?#{==:#{pane_title},#{host}},shell,#{pane_title}} #[default] "
set-option -g pane-border-style        "fg=#0d1410"
set-option -g pane-active-border-style "fg=#166534"

# ─── Copy-mode highlight ───────────────────────────────────────────────
set-option -g mode-style "fg=#05070a,bg=#22c55e"

# ─── Messages and prompts ──────────────────────────────────────────────
set-option -g message-style         "fg=#d1fae5,bg=#0d1410"
set-option -g message-command-style "fg=#4ade80,bg=#0d1410"
set-option -g display-time 2000

# ─── Status line (hidden by default, Ctrl+A then S to show) ────────────
set-option -g status-position bottom
set-option -g status-justify  left
set-option -g status-style    "fg=#86efac,bg=#05070a"
set-option -g status-left-length  40
set-option -g status-right-length 80
set-option -g status-left  "#(~/.dotfiles/tmux/scripts/session-tabs.sh #S)#[default] "
set-option -g status-right "#[fg=#05070a,bg=#166534] #(ip -4 -brief address show tun0 2>/dev/null | awk '{print $3}' | cut -d/ -f1 || echo 'vpn down') #[fg=#166534,bg=#22c55e]#[fg=#05070a,bg=#22c55e,bold] #(cat ~/.cache/oscp-target 2>/dev/null || echo 'no target') #[fg=#22c55e,bg=#05070a]#[fg=#86efac,bg=#05070a] #(~/.dotfiles/tmux/scripts/shorten-path.sh #{pane_current_path}) "
set-option -g window-status-format         "#[fg=#0a0f0c,bg=#1a2e22] #I:#W #[fg=#1a2e22,bg=#05070a]"
set-option -g window-status-current-format "#[fg=#0a0f0c,bg=#22c55e,bold] #I:#W #[fg=#22c55e,bg=#05070a]"
set-option -g window-status-separator ""
